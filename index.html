<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keerthana — say hi 👋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --sun:#ffb800; --white:#ffffff; --ink:#6b1d0b; --smile:#e0471b; --blush:#ff7a8a; --dark:#3a1406; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--sun);color:var(--white);font-family:Fredoka,'Arial Rounded MT Bold','Nunito',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  button{font-family:inherit}

  /* soft texture + floating confetti dots */
  body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1.2px,transparent 1.3px);background-size:26px 26px;pointer-events:none}
  .float{position:fixed;pointer-events:none;opacity:.9}

  /* ---------- top bar ---------- */
  header{position:fixed;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;z-index:20}
  .tag{font-weight:700;font-size:15px;background:rgba(255,255,255,.22);border:2px solid #fff;border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:8px}
  .tag i{width:9px;height:9px;border-radius:50%;background:#33d17a;box-shadow:0 0 0 3px rgba(51,209,122,.35)}
  #snd{font-weight:700;font-size:14px;border:2px solid #fff;background:#fff;color:var(--dark);border-radius:999px;padding:9px 15px;cursor:pointer}
  #snd[aria-pressed="false"]{background:transparent;color:#fff}

  /* ---------- stage ---------- */
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
  #name{font-weight:700;font-size:clamp(58px,15.5vw,230px);line-height:1;white-space:nowrap;letter-spacing:-.02em;display:flex;align-items:baseline;position:relative}
  .l{display:inline-block;cursor:pointer;transform-origin:50% 100%;text-shadow:0 .05em 0 rgba(107,29,11,.18)}
  .face{position:relative;display:inline-flex;align-items:baseline;gap:.01em}
  .eye{width:.56em;height:.56em;display:inline-block;overflow:visible;cursor:pointer;transform-origin:50% 100%;filter:drop-shadow(0 .05em 0 rgba(107,29,11,.18))}
  .mouthBox{position:absolute;left:50%;top:100%;transform:translate(-50%,.02em);width:.62em;overflow:visible}
  .blush{position:absolute;top:58%;width:.2em;height:.11em;border-radius:50%;background:var(--blush);opacity:.0;transition:opacity .3s;pointer-events:none}
  .blush.l1{left:-.06em}.blush.r1{right:-.06em}
  .zzz{position:absolute;right:-.2em;top:-.35em;font-size:.28em;color:#fff;opacity:0;pointer-events:none}

  #bubble{position:absolute;left:50%;top:-.95em;transform:translateX(-10%) scale(.8);font-size:.17em;font-weight:700;background:#fff;color:var(--dark);border-radius:22px 22px 22px 6px;padding:.45em .8em;white-space:nowrap;
          opacity:0;transition:all .3s cubic-bezier(.3,1.7,.5,1);pointer-events:none;box-shadow:0 6px 0 rgba(107,29,11,.18)}
  #bubble.on{opacity:1;transform:translateX(-10%) scale(1)}

  .sub{font-weight:500;letter-spacing:.55em;font-size:clamp(12px,1.25vw,17px);margin-top:clamp(40px,7vw,96px);text-align:center;padding-left:.55em}
  .ctas{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;justify-content:center}
  .btn{font-weight:700;font-size:17px;border:3px solid #fff;border-radius:999px;padding:14px 26px;cursor:pointer;background:transparent;color:#fff;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
  .btn:hover{transform:translateY(-3px) rotate(-2deg)}
  .btn.solid{background:#fff;color:var(--dark)}
  .moods{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.22);border:2px solid #fff;border-radius:999px;padding:5px;z-index:20}
  .moods button{border:0;background:transparent;color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap}
  .moods button.on{background:#fff;color:var(--dark)}
  .hint{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:500;opacity:.9;white-space:nowrap}
  .fx{position:fixed;pointer-events:none;z-index:30;font-size:26px}

  /* ---------- entry ---------- */
  #entry{position:fixed;inset:0;z-index:50;background:var(--sun);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s, visibility .6s}
  #entry.gone{opacity:0;visibility:hidden}
  #entry .big{font-size:clamp(30px,4vw,48px);font-weight:700;text-align:center}
  #entry .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  @media (max-width:640px){ .moods button{padding:7px 8px;font-size:12px} .hint{font-size:12px;bottom:70px} }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

<div id="entry">
  <div style="font-size:64px">👀</div>
  <div class="big">Someone wants to say hi…</div>
  <div class="row">
    <button class="btn solid" id="goSound">🔊 Say hi with sound</button>
    <button class="btn" id="goQuiet">Quietly</button>
  </div>
</div>

<header>
  <div></div>
  <button id="snd" aria-pressed="false">🔇 sound off</button>
</header>

<main>
  <h1 id="name" aria-label="Keerthana">
    <div id="bubble">hi! 👋</div>
    <span class="l" data-n="0">K</span>
    <span class="face">
      <svg class="eye" data-n="1" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <svg class="eye" data-n="2" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <span class="blush l1"></span><span class="blush r1"></span>
      <span class="zzz">z<small>z</small></span>
      <svg class="mouthBox" viewBox="0 0 120 70" aria-hidden="true">
        <path id="mouth" d="M14 10 Q60 62 106 10" fill="none" stroke="#e0471b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="tongue" d="M50 34 Q60 58 70 34 Z" fill="#ff7a8a" opacity="0"/>
      </svg>
    </span>
    <span class="l" data-n="3">r</span><span class="l" data-n="4">t</span><span class="l" data-n="5">h</span><span class="l" data-n="6">a</span><span class="l" data-n="7">n</span><span class="l" data-n="8">a</span>
  </h1>
</main>

<div class="hint">move your mouse · click my eyes · hover my letters 🎵</div>
<div class="moods">
  <button data-m="happy" class="on">😊 Happy</button>
  <button data-m="love">😍 Love</button>
  <button data-m="wow">🤩 Wow</button>
  <button data-m="silly">😜 Silly</button>
  <button data-m="sleep">😴 Sleepy</button>
</div>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= SOUND (all made in code) ================= */
const A = { ctx: null, on: false };
function unlock() { try { A.ctx = A.ctx || new (window.AudioContext || window.webkitAudioContext)(); A.ctx.state === 'suspended' && A.ctx.resume(); } catch (e) {} }
function tone(f, d = .25, type = 'sine', v = .15, to = null, at = 0) {
  if (!A.on || !A.ctx) return;
  const t = A.ctx.currentTime + at, o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(A.ctx.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, freq, v) {
  if (!A.on || !A.ctx) return;
  const n = A.ctx.sampleRate * d, b = A.ctx.createBuffer(1, n, A.ctx.sampleRate), c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const s = A.ctx.createBufferSource(), f = A.ctx.createBiquadFilter(), g = A.ctx.createGain();
  s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v; s.connect(f).connect(g).connect(A.ctx.destination); s.start();
}
// a marimba note for each letter → hovering the name plays a little tune
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98];
const SFX = {
  note: i => { tone(NOTES[i], .5, 'triangle', .16); tone(NOTES[i] * 2, .18, 'sine', .05); },
  boing: () => tone(180, .4, 'sine', .2, 640),
  giggle: () => [0, .09, .18].forEach((t, i) => tone(900 + i * 220, .08, 'triangle', .12, 1300 + i * 220, t)),
  pop: () => tone(320, .09, 'square', .05, 1200),
  mwah: () => { tone(700, .12, 'sine', .14, 1100); tone(1000, .3, 'sine', .12, 500, .12); },
  sparkle: () => [0, .06, .12, .18].forEach((t, i) => tone(1800 + i * 300, .1, 'sine', .06, null, t)),
  blep: () => tone(400, .15, 'sine', .12, 220),
  yawn: () => tone(620, 1.1, 'sine', .08, 210),
  snore: () => noise(1.4, 300, .35),
  wake: () => tone(300, .25, 'triangle', .15, 900)
};
const sndBtn = document.getElementById('snd');
function setSound(on) { A.on = on; if (on) unlock(); sndBtn.setAttribute('aria-pressed', on); sndBtn.textContent = on ? '🔊 sound on' : '🔇 sound off'; }
sndBtn.onclick = () => { setSound(!A.on); SFX.giggle(); };

/* ================= THE EYES: real "e" letters, drawn as shapes ================= */
// the "e": a crossbar + a round bowl that opens bottom-right; the pupil lives in the upper loop
const E_SVG = `
  <path d="M17 57 H83 A33 33 0 1 0 75 80" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="pupilWrap" transform="translate(50 37)">
    <g class="pupil">
      <circle class="dot" r="10.5" fill="#6b1d0b"/><circle class="shine" cx="3.6" cy="-3.8" r="3.4" fill="#fff"/>
      <path class="heartP" d="M0 9 C -14 0 -11 -12 -4 -11 C -1 -11 0 -8 0 -7 C 0 -8 1 -11 4 -11 C 11 -12 14 0 0 9 Z" fill="#ff3d6e" opacity="0"/>
      <path class="starP" d="M0 -12 L3 -3 L12 -3 L5 3 L8 12 L0 6 L-8 12 L-5 3 L-12 -3 L-3 -3 Z" fill="#fff" stroke="#6b1d0b" stroke-width="2" opacity="0"/>
    </g>
    <path class="lid" d="M-15 2 Q0 12 15 2" fill="none" stroke="#6b1d0b" stroke-width="5" stroke-linecap="round" opacity="0"/>
  </g>`;
const eyes = [...document.querySelectorAll('.eye')];
eyes.forEach(e => e.innerHTML = E_SVG);
const pupils = eyes.map(e => e.querySelector('.pupil')), lids = eyes.map(e => e.querySelector('.lid'));
const mouth = document.getElementById('mouth'), tongue = document.getElementById('tongue');
const blush = document.querySelectorAll('.blush'), zzz = document.querySelector('.zzz'), bubble = document.getElementById('bubble');

const MOUTHS = {
  happy: 'M14 10 Q60 62 106 10',
  grin:  'M10 8 Q60 72 110 8 Q60 30 10 8',
  wow:   'M48 10 Q60 52 72 10 Q60 -4 48 10',
  love:  'M22 14 Q60 50 98 14',
  silly: 'M18 14 Q60 56 102 14',
  sleep: 'M44 24 Q60 32 76 24',
  flat:  'M34 24 Q60 26 86 24'
};
const setMouth = (k, dur = .25) => gsap.to(mouth, { attr: { d: MOUTHS[k] }, duration: dur, ease: 'back.out(2)' });

/* follow the cursor (or finger) */
const P = { x: innerWidth / 2, y: innerHeight / 2 };
let mood = 'happy', sleeping = false;
function look() {
  if (sleeping) return;
  eyes.forEach((e, i) => {
    const r = e.getBoundingClientRect(), cx = r.left + r.width * .5, cy = r.top + r.height * .36;
    let dx = P.x - cx, dy = P.y - cy; const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260) * 5;
    if (mood === 'silly') { dx = i === 0 ? 1 : -1; dy = 0.2; }            // cross-eyed
    gsap.to(pupils[i], { x: mood === 'silly' ? dx * 5 : dx / d * k, y: mood === 'silly' ? 1 : dy / d * k, duration: .25, overwrite: 'auto' });
  });
}
addEventListener('pointermove', e => { P.x = e.clientX; P.y = e.clientY; look(); poke(); });
addEventListener('touchmove', e => { const t = e.touches[0]; P.x = t.clientX; P.y = t.clientY; look(); poke(); }, { passive: true });

/* blink (only the pupil squishes — the "e" always stays readable) */
function blink() {
  if (!sleeping && mood !== 'love') gsap.to(pupils, { scaleY: .1, duration: .07, yoyo: true, repeat: 1, transformOrigin: '50% 50%' });
  setTimeout(blink, 2300 + Math.random() * 2800);
}

/* ================= MOODS ================= */
function setMood(m) {
  mood = m; if (sleeping && m !== 'sleep') wake(true);
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  eyes.forEach(e => { gsap.to(e.querySelectorAll('.dot,.shine'), { opacity: m === 'love' ? 0 : 1, duration: .2 });
    gsap.to(e.querySelector('.heartP'), { opacity: m === 'love' ? 1 : 0, scale: m === 'love' ? 1.15 : 1, transformOrigin: '50% 50%', duration: .25 });
    gsap.to(e.querySelector('.starP'), { opacity: m === 'wow' ? 1 : 0, rotation: m === 'wow' ? 180 : 0, transformOrigin: '50% 50%', duration: .4 }); });
  gsap.to(blush, { opacity: m === 'love' || m === 'happy' ? .75 : m === 'silly' ? .5 : 0, duration: .3 });
  gsap.to(tongue, { opacity: m === 'silly' ? 1 : 0, duration: .2 });
  gsap.to(eyes, { scale: m === 'wow' ? 1.12 : 1, duration: .35, ease: 'back.out(3)' });
  setMouth({ happy: 'happy', love: 'love', wow: 'wow', silly: 'silly', sleep: 'sleep' }[m]);
  if (m === 'love') { SFX.mwah(); burst(['💖', '💕', '💗'], 8); say('aww, you\'re sweet 💕'); }
  if (m === 'wow') { SFX.sparkle(); burst(['✨', '⭐', '🌟'], 7); say('woooow ✨'); }
  if (m === 'silly') { SFX.blep(); say('blep 😜'); }
  if (m === 'happy') { SFX.giggle(); say('hi! I\'m Keerthana 👋'); }
  if (m === 'sleep') goSleep();
  look();
}
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => setMood(b.dataset.m));

/* sleep after idling; wake on any move */
let idleT = null, snoreT = null;
function goSleep() {
  if (sleeping) return; sleeping = true; SFX.yawn();
  gsap.to(pupils, { opacity: 0, duration: .2 }); gsap.to(lids, { opacity: 1, duration: .2 });
  setMouth('sleep'); gsap.to(zzz, { opacity: 1, y: -8, duration: .6 }); say('zzz… (wiggle the mouse)');
  clearInterval(snoreT); snoreT = setInterval(() => sleeping && SFX.snore(), 2600);
  if (!reduce) gsap.to('#name .l, #name .face', { y: 4, duration: 1.3, yoyo: true, repeat: -1, ease: 'sine.inOut', id: 'breathe' });
}
function wake(quiet) {
  if (!sleeping) return; sleeping = false; clearInterval(snoreT);
  gsap.getById('breathe') && gsap.getById('breathe').kill(); gsap.to('#name .l, #name .face', { y: 0, duration: .2 });
  gsap.to(pupils, { opacity: 1, duration: .15 }); gsap.to(lids, { opacity: 0, duration: .15 }); gsap.to(zzz, { opacity: 0, y: 0, duration: .2 });
  if (!quiet) { SFX.wake(); jump(); say('oh! you\'re back 🧡'); mood = 'happy'; document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === 'happy')); setMouth('grin'); setTimeout(() => setMouth('happy'), 900); }
}
function poke() {
  if (sleeping && mood !== 'sleep') wake();
  else if (sleeping && mood === 'sleep') { /* stay asleep when chosen from the menu until moved a lot */ }
  clearTimeout(idleT); idleT = setTimeout(() => { mood = 'sleep'; document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === 'sleep')); goSleep(); }, 15000);
}
addEventListener('pointerdown', () => { if (sleeping) { mood = 'happy'; wake(); } });

/* ================= LITTLE REACTIONS ================= */
function say(t, ms = 2600) { bubble.textContent = t; bubble.classList.add('on'); clearTimeout(bubble._t); bubble._t = setTimeout(() => bubble.classList.remove('on'), ms); }
function burst(list, n, x, y) {
  const r = document.querySelector('.face').getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'fx'; s.textContent = list[i % list.length];
    s.style.left = (x ?? r.left + r.width / 2) + 'px'; s.style.top = (y ?? r.top + r.height / 3) + 'px'; document.body.appendChild(s);
    gsap.fromTo(s, { scale: 0 }, { scale: 1 + Math.random() * .6, x: (Math.random() - .5) * 260, y: -80 - Math.random() * 160, rotation: (Math.random() - .5) * 90, opacity: 0, duration: 1.4 + Math.random() * .6, ease: 'power2.out', onComplete: () => s.remove() });
  }
}
function jump() { gsap.timeline().to('#name', { scaleY: .9, scaleX: 1.04, transformOrigin: '50% 100%', duration: .1 }).to('#name', { y: -26, scaleY: 1.05, scaleX: .98, duration: .22, ease: 'power2.out' }).to('#name', { y: 0, scaleY: 1, scaleX: 1, duration: .5, ease: 'bounce.out' }); }

// hover a letter → it jumps and plays its note (the name is a xylophone)
document.querySelectorAll('[data-n]').forEach(el => {
  el.addEventListener('pointerenter', () => {
    SFX.note(+el.dataset.n);
    gsap.timeline().to(el, { y: -18, scaleY: 1.12, scaleX: .92, duration: .14, ease: 'power2.out', transformOrigin: '50% 100%' })
      .to(el, { y: 0, scaleY: 1, scaleX: 1, duration: .45, ease: 'elastic.out(1.2,.4)' });
  });
});
// click an eye → wink + giggle
const winks = ['hehe 😉', 'that tickles!', 'boop! 👆', 'I see you 👀'];
eyes.forEach((e, i) => e.addEventListener('click', ev => {
  ev.stopPropagation(); if (sleeping) { mood = 'happy'; wake(); return; }
  SFX.giggle(); gsap.to(lids[i], { opacity: 1, duration: .05 }); gsap.to(pupils[i], { opacity: 0, duration: .05 });
  setMouth('grin'); gsap.to(blush, { opacity: .9, duration: .2 });
  burst(['✨', '💛'], 4); say(winks[(Math.random() * winks.length) | 0]);
  setTimeout(() => { gsap.to(lids[i], { opacity: 0, duration: .1 }); gsap.to(pupils[i], { opacity: 1, duration: .1 }); setMood(mood === 'sleep' ? 'happy' : mood); }, 500);
}));
// click K or the rest of the name → boing
document.querySelectorAll('.l').forEach(l => l.addEventListener('click', () => { SFX.boing(); jump(); }));
// random tongue blep every so often
setInterval(() => { if (!sleeping && mood === 'happy' && Math.random() < .5) { SFX.blep(); gsap.timeline().to(tongue, { opacity: 1, duration: .1 }).to(tongue, { opacity: 0, duration: .15, delay: .7 }); } }, 7000);


/* floating doodles */
['⭐', '💛', '✨', '☁️', '🌴', '💬'].forEach((s, i) => {
  const d = document.createElement('div'); d.className = 'float'; d.textContent = s; d.style.fontSize = (22 + (i % 3) * 8) + 'px';
  d.style.left = [8, 86, 14, 78, 90, 6][i] + '%'; d.style.top = [20, 22, 72, 76, 50, 46][i] + '%'; document.body.appendChild(d);
  if (!reduce) gsap.to(d, { y: -16, rotation: i % 2 ? 14 : -14, duration: 2 + i * .35, yoyo: true, repeat: -1, ease: 'sine.inOut' });
});

/* ================= ENTRY ================= */
function enter(withSound) {
  setSound(withSound); document.getElementById('entry').classList.add('gone');
  if (!reduce) gsap.from('#name .l, #name .face', { y: 120, opacity: 0, rotation: () => (Math.random() - .5) * 30, duration: .9, stagger: .06, ease: 'back.out(1.8)', delay: .2,
    onStart: () => { if (withSound) NOTES.forEach((_, i) => setTimeout(() => SFX.note(i), 220 + i * 70)); } });
  setTimeout(() => { setMood('happy'); blink(); poke(); }, 1100);
}
document.getElementById('goSound').onclick = () => enter(true);
document.getElementById('goQuiet').onclick = () => enter(false);
</script>
</body>
</html>
